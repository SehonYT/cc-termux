name: version

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag:
    # A run that only fell over on runner allocation is not a failed build. The step below
    # re-checks that and refuses when a test genuinely failed.
    if: >-
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # A stalled run reports success with no jobs. Tagging there would publish a release
      # whose tests never ran, so the job count is checked before anything else.
      - name: Refuse to tag a run that produced no jobs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs | length')
          echo "ci produced $jobs job(s)"
          if [ "$jobs" -eq 0 ]; then
            echo "::error::the ci run produced no jobs, so nothing was verified; refusing to tag"
            exit 1
          fi
          # A job with zero steps never ran: GitHub cancelled it before a runner picked it
          # up, which says nothing about the code. A job with steps that failed does.
          infraless=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0)] | length')
          real=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure")] | length')
          echo "cancelled before starting: $infraless | genuinely failed: $real"
          if [ "$real" -gt 0 ]; then
            echo "::error::$real job(s) ran and failed; refusing to tag"
            exit 1
          fi
          if [ "$infraless" -gt 0 ]; then
            echo "::warning::$infraless job(s) were cancelled before starting (runner allocation), not counted as failures"
          fi
      # Always check out the trusted default branch, never untrusted PR code.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: echo "tag=$(node scripts/version.mjs --tag --sha "$TARGET_SHA")" >> "$GITHUB_OUTPUT"
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_SHA" --depth=1 || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "modelmesh $TAG"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automated release for $TARGET_SHA" || true
      # A rolling pointer to the newest commit whose tests passed. get.sh and update
      # resolve this rather than main, so a commit that failed ci is never pulled.
      - name: Point the verified marker at this commit
        run: |
          set -euo pipefail
          # A lightweight ref in its own namespace: never checked out, only read.
          git push --force origin "$TARGET_SHA:refs/tags/verified"
          echo "verified now points at $TARGET_SHA"
