name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building project..."

      - name: Send Discord update
        if: always()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi
          case "$STATUS" in
            success)  color=5763719; title="✅ Build successful" ;;
            failure)  color=15548997; title="❌ Build failed" ;;
            cancelled) color=16776960; title="⏹ Build cancelled" ;;
            *)        color=3447003; title="🔨 Build $STATUS" ;;
          esac
          short=$(git rev-parse --short HEAD)
          logo="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/assets/logo.png"
          payload=$(jq -n \
            --arg logo "$logo" \
            --arg title "$title" \
            --argjson color "$color" \
            --arg status "$STATUS" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg short "$short" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "cc-termux CI",
              avatar_url: $logo,
              embeds: [{
                author: {name: "cc-termux", icon_url: $logo},
                title: $title,
                url: $url,
                color: $color,
                description: ("Push to **" + $branch + "** by **" + $actor + "**"),
                thumbnail: {url: $logo},
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Workflow", value: $workflow, inline: true},
                  {name: "Status", value: ("`" + $status + "`"), inline: true},
                  {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                  {name: "Commit", value: ("`" + $short + "`"), inline: true},
                  {name: "Run", value: ("[Open workflow run](" + $url + ")"), inline: false},
                  {name: "Community", value: "[Join the cc-termux Discord](https://discord.gg/AF8zvEDcSG)", inline: false}
                ],
                footer: {text: "cc-termux · GitHub Actions", icon_url: $logo},
                timestamp: $ts
              }]
            }')
          curl -fsS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
          echo "Discord embed sent."
