name: Build

# Reports the outcome of the real test workflow. This job must never decide success on its
# own: the previous version ran "echo Building project..." and reported that, so every
# Discord message said the build passed while ci was stalling or failing.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != ''
    steps:
      - name: Summarise the real run
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the conclusion GitHub recorded for the test workflow, not this job's status.
          conclusion="${{ github.event.workflow_run.conclusion }}"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

          # Count the jobs that failed or never started, so a stall cannot look like a pass.
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs')
          total=$(echo "$jobs" | jq 'length')
          failed=$(echo "$jobs" | jq '[.[] | select(.conclusion == "failure")] | length')
          cancelled=$(echo "$jobs" | jq '[.[] | select(.conclusion == "cancelled" or .conclusion == "timed_out")] | length')
          ok=$(echo "$jobs" | jq '[.[] | select(.conclusion == "success")] | length')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "cancelled=$cancelled" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

          # Name what broke, so the message is actionable rather than a colour.
          names=$(echo "$jobs" | jq -r '[.[] | select(.conclusion == "failure") | .name] | join(", ")')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "run $RUN_ID: $conclusion ($ok ok, $failed failed, $cancelled cancelled of $total)"

      - name: Send Discord update
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CONCLUSION: ${{ steps.r.outputs.conclusion }}
          TOTAL: ${{ steps.r.outputs.total }}
          FAILED: ${{ steps.r.outputs.failed }}
          CANCELLED: ${{ steps.r.outputs.cancelled }}
          OK: ${{ steps.r.outputs.ok }}
          FAILED_NAMES: ${{ steps.r.outputs.names }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi
          # A run that produced no jobs is a stall, not a pass.
          if [ "${TOTAL:-0}" -eq 0 ]; then
            CONCLUSION="stalled"
          fi
          case "$CONCLUSION" in
            success)  color=5763719; title="✅ CI passed" ;;
            failure)  color=15548997; title="❌ CI failed" ;;
            cancelled) color=16776960; title="⏹ CI cancelled" ;;
            stalled)  color=16776960; title="⚠️ CI produced no jobs" ;;
            *)        color=3447003; title="🔨 CI $CONCLUSION" ;;
          esac
          short=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          logo="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/${{ github.event.workflow_run.head_sha }}/assets/logo.png"
          detail="${OK:-0}/${TOTAL:-0} jobs passed"
          [ "${FAILED:-0}" -gt 0 ] && detail="$detail · ${FAILED} failed: ${FAILED_NAMES}"
          [ "${CANCELLED:-0}" -gt 0 ] && detail="$detail · ${CANCELLED} cancelled (a stalled runner)"
          payload=$(jq -n \
            --arg logo "$logo" \
            --arg title "$title" \
            --argjson color "$color" \
            --arg status "$CONCLUSION" \
            --arg detail "$detail" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "${{ github.event.workflow_run.head_branch }}" \
            --arg actor "${{ github.event.workflow_run.actor.login }}" \
            --arg short "$short" \
            --arg url "${{ github.event.workflow_run.html_url }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "modelmesh CI",
              avatar_url: $logo,
              embeds: [{
                author: {name: "modelmesh", icon_url: $logo},
                title: $title,
                url: $url,
                color: $color,
                description: ("Push to **" + $branch + "** by **" + $actor + "**"),
                thumbnail: {url: $logo},
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Result", value: ("`" + $status + "`"), inline: true},
                  {name: "Jobs", value: $detail, inline: false},
                  {name: "Commit", value: ("`" + $short + "`"), inline: true},
                  {name: "Run", value: ("[Open workflow run](" + $url + ")"), inline: false},
                  {name: "Community", value: "[Join the modelmesh Discord](https://discord.gg/AF8zvEDcSG)", inline: false}
                ],
                footer: {text: "modelmesh · GitHub Actions", icon_url: $logo},
                timestamp: $ts
              }]
            }')
          # Retry once: a transient webhook failure must not lose the message, and a
          # permanent one must be visible rather than silently swallowed.
          if ! curl -fsS --retry 2 --retry-delay 2 -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"; then
            echo "::error::the Discord webhook rejected the notification for $CONCLUSION"
            exit 1
          fi
          echo "Discord embed sent for $CONCLUSION."
