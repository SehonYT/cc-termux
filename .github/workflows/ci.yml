name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: node install.mjs --check
      - run: npm test

  # Run install.mjs --code-only on every OS into an isolated HOME, then verify the files,
  # shims and CLI. The Claude Code binary is faked, so nothing is downloaded.
  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Code-only install into an isolated HOME (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cc-install-smoke"
          rm -rf "$work"
          export HOME="$work/home"
          export PREFIX="$work/prefix"
          root="$HOME/.local/share/cc-termux"
          export CC_TERMUX_ROOT="$root"
          export CC_TERMUX_CONFIG="$root/smoke/config.json"
          export CC_TERMUX_CACHE="$root/smoke-cache"
          export CC_TERMUX_NO_BANNER=1
          export CC_TERMUX_NO_PROMPT=1
          mkdir -p "$root/bin"
          # Fake an installed Claude Code build: --code-only must refresh the cc-termux code
          # without downloading the ~150 MB Claude Code binary.
          : > "$root/bin/claude.bin"
          printf '9.9.9\n' > "$root/VERSION"

          # The install plan must print the resolver's paths.
          plan="$(node install.mjs --check)"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -F "root     : $root"
          printf '%s\n' "$plan" | grep -F "config   : $CC_TERMUX_CONFIG"
          printf '%s\n' "$plan" | grep -F "cache    : $CC_TERMUX_CACHE"

          node install.mjs --code-only --root "$root" --no-setup

          for f in bin/cc-launcher.mjs bin/cc-mcp.mjs proxy/server.mjs patches.json bin/cc-paths.mjs; do
            test -f "$root/$f" || { echo "missing installed file: $f"; exit 1; }
          done
          test -f "$CC_TERMUX_CONFIG" || { echo "installer did not create the config"; exit 1; }
          test -f "$HOME/.local/bin/claude" || { echo "missing ~/.local/bin/claude shim"; exit 1; }
          grep -q 'cc-launcher.mjs' "$HOME/.local/bin/claude"
          test -f "$PREFIX/bin/cc-termux" || { echo "missing cc-termux shim in PREFIX"; exit 1; }
          out="$(node "$root/bin/cc-termux" path)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "$root"

      - name: Code-only install into an isolated USERPROFILE (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          # Native Windows paths for Node; cygpath -u converts them for the bash tests below.
          work="$(cygpath -m "$RUNNER_TEMP")/cc-install-smoke"
          export HOME="$(cygpath -u "$work/home")"
          export USERPROFILE="$(cygpath -m "$work/home")"
          export APPDATA="$(cygpath -m "$work/appdata")"
          export LOCALAPPDATA="$(cygpath -m "$work/localappdata")"
          rm -rf "$HOME" "$(cygpath -u "$APPDATA")" "$(cygpath -u "$LOCALAPPDATA")"
          mkdir -p "$HOME" "$(cygpath -u "$APPDATA")" "$(cygpath -u "$LOCALAPPDATA")"
          # No CC_TERMUX_CONFIG / CC_TERMUX_CACHE here: the real Windows layout must be
          # exercised (APPDATA\cc-termux\config.json, LOCALAPPDATA\cc-termux\cache).
          root="$LOCALAPPDATA/cc-termux"
          export CC_TERMUX_ROOT="$root"
          export CC_TERMUX_NO_BANNER=1
          export CC_TERMUX_NO_PROMPT=1
          mkdir -p "$(cygpath -u "$root/bin")"
          # Fake an installed Claude Code build: --code-only must refresh the cc-termux code
          # without downloading the ~150 MB Claude Code binary.
          : > "$(cygpath -u "$root/bin/claude.exe")"
          printf '9.9.9\n' > "$(cygpath -u "$root/VERSION")"

          # The install plan must print the resolver's paths (root is passed verbatim;
          # config/cache are checked by exact location via the file assertions below).
          plan="$(node install.mjs --check --root "$root")"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -F "root     : $root"
          printf '%s\n' "$plan" | grep -F "config   :"
          printf '%s\n' "$plan" | grep -F "cache    :"

          node install.mjs --code-only --root "$root" --no-setup 2>&1 | tee "$(cygpath -u "$work/install.log")"
          # Windows-only: the installer announces the Windows locations it created.
          grep -q 'install root:' "$(cygpath -u "$work/install.log")"
          grep -q 'config file :' "$(cygpath -u "$work/install.log")"
          grep -q 'cache dir   :' "$(cygpath -u "$work/install.log")"

          for f in bin/cc-launcher.mjs bin/cc-mcp.mjs proxy/server.mjs patches.json bin/cc-paths.mjs; do
            test -f "$(cygpath -u "$root/$f")" || { echo "missing installed file: $f"; exit 1; }
          done
          test -f "$(cygpath -u "$APPDATA/cc-termux/config.json")" || { echo "installer did not create the Windows config"; exit 1; }
          test -d "$(cygpath -u "$LOCALAPPDATA/cc-termux/cache")" || { echo "installer did not create the Windows cache dir"; exit 1; }
          shim="$APPDATA/npm/claude.cmd"
          test -f "$(cygpath -u "$shim")" || { echo "missing claude.cmd shim"; exit 1; }
          grep -q 'cc-launcher.mjs' "$(cygpath -u "$shim")"
          out="$(node "$(cygpath -m "$root/bin/cc-termux")" path)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "$root"
