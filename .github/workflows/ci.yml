name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: node install.mjs --check
      - run: npm test

  # The check matrix above runs on glibc Linux. Alpine is musl and is where a wrong libc
  # choice shows up, so it gets real containers rather than a simulated filesystem.
  alpine:
    name: check (alpine, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    container:
      image: node:${{ matrix.node }}-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this really is musl
        run: |
          set -e
          test -f /etc/alpine-release || { echo 'not Alpine'; exit 1; }
          ldd --version 2>&1 | grep -qi musl || { echo 'not musl'; exit 1; }
          echo "alpine $(cat /etc/alpine-release), $(ldd --version 2>&1 | head -1)"
      - run: node --version
      # git and bash are not in the node:alpine image and the suite reads the worktree.
      - run: apk add --no-cache git bash
      - run: npm run check
      - run: node install.mjs --check
      - run: npm test
      - name: Alpine really is musl, and detection agrees
        run: |
          node -e "
          const fs = require('node:fs');
          import('./bin/cc-platform.mjs').then((m) => {
            const real = (p) => fs.existsSync(p);
            const musl = m.isMusl({ arch: process.arch, hasFile: real });
            const t = m.detectTarget({ platform: 'linux', arch: process.arch, hasFile: real });
            console.log('arch:', process.arch, '| isMusl:', musl, '| target:', t.pkg);
            if (!musl) { console.error('isMusl() failed to see this Alpine host'); process.exit(1); }
            if (!/-musl$/.test(t.pkg || '')) { console.error('must select a musl build, got ' + t.pkg); process.exit(1); }
            console.log('ok: this musl host resolves to the musl build');
          });
          "
      # The full suite must also pass on musl, not just the detection check.
      - name: Full suite on musl
        run: npm test

  # Run install.mjs --code-only on every OS into an isolated HOME, then verify the files,
  # shims and CLI. The Claude Code binary is faked, so nothing is downloaded.
  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Code-only install into an isolated HOME (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cc-install-smoke"
          rm -rf "$work"
          export HOME="$work/home"
          export PREFIX="$work/prefix"
          root="$HOME/.local/share/modelmesh"
          export MODELMESH_ROOT="$root"
          export MODELMESH_CONFIG="$root/smoke/config.json"
          export MODELMESH_CACHE="$root/smoke-cache"
          export MODELMESH_NO_BANNER=1
          export MODELMESH_NO_PROMPT=1
          mkdir -p "$root/bin"
          # Fake an installed Claude Code build: --code-only must refresh the modelmesh code
          # without downloading the ~150 MB Claude Code binary.
          : > "$root/bin/claude.bin"
          printf '9.9.9\n' > "$root/VERSION"

          # The install plan must print the resolver's paths.
          plan="$(node install.mjs --check)"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -F "root     : $root"
          printf '%s\n' "$plan" | grep -F "config   : $MODELMESH_CONFIG"
          printf '%s\n' "$plan" | grep -F "cache    : $MODELMESH_CACHE"

          node install.mjs --code-only --root "$root" --no-setup

          for f in bin/cc-launcher.mjs bin/cc-mcp.mjs proxy/server.mjs patches.json bin/cc-paths.mjs; do
            test -f "$root/$f" || { echo "missing installed file: $f"; exit 1; }
          done
          test -f "$MODELMESH_CONFIG" || { echo "installer did not create the config"; exit 1; }
          test -f "$HOME/.local/bin/claude" || { echo "missing ~/.local/bin/claude shim"; exit 1; }
          grep -q 'cc-launcher.mjs' "$HOME/.local/bin/claude"
          test -f "$PREFIX/bin/modelmesh" || { echo "missing modelmesh shim in PREFIX"; exit 1; }
          out="$(node "$root/bin/modelmesh" path)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "$root"

      - name: Code-only install into an isolated USERPROFILE (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          # Native Windows paths for Node; cygpath -u converts them for the bash tests below.
          work="$(cygpath -m "$RUNNER_TEMP")/cc-install-smoke"
          export HOME="$(cygpath -u "$work/home")"
          export USERPROFILE="$(cygpath -m "$work/home")"
          export APPDATA="$(cygpath -m "$work/appdata")"
          export LOCALAPPDATA="$(cygpath -m "$work/localappdata")"
          rm -rf "$HOME" "$(cygpath -u "$APPDATA")" "$(cygpath -u "$LOCALAPPDATA")"
          mkdir -p "$HOME" "$(cygpath -u "$APPDATA")" "$(cygpath -u "$LOCALAPPDATA")"
          # No MODELMESH_CONFIG / MODELMESH_CACHE here: the real Windows layout must be
          # exercised (APPDATA\modelmesh\config.json, LOCALAPPDATA\modelmesh\cache).
          root="$LOCALAPPDATA/modelmesh"
          export MODELMESH_ROOT="$root"
          export MODELMESH_NO_BANNER=1
          export MODELMESH_NO_PROMPT=1
          mkdir -p "$(cygpath -u "$root/bin")"
          # Fake an installed Claude Code build: --code-only must refresh the modelmesh code
          # without downloading the ~150 MB Claude Code binary.
          : > "$(cygpath -u "$root/bin/claude.exe")"
          printf '9.9.9\n' > "$(cygpath -u "$root/VERSION")"

          # The install plan must print the resolver's paths (root is passed verbatim;
          # config/cache are checked by exact location via the file assertions below).
          plan="$(node install.mjs --check --root "$root")"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -F "root     : $root"
          printf '%s\n' "$plan" | grep -F "config   :"
          printf '%s\n' "$plan" | grep -F "cache    :"

          node install.mjs --code-only --root "$root" --no-setup 2>&1 | tee "$(cygpath -u "$work/install.log")"
          # Windows-only: the installer announces the Windows locations it created.
          grep -q 'install root:' "$(cygpath -u "$work/install.log")"
          grep -q 'config file :' "$(cygpath -u "$work/install.log")"
          grep -q 'cache dir   :' "$(cygpath -u "$work/install.log")"

          for f in bin/cc-launcher.mjs bin/cc-mcp.mjs proxy/server.mjs patches.json bin/cc-paths.mjs; do
            test -f "$(cygpath -u "$root/$f")" || { echo "missing installed file: $f"; exit 1; }
          done
          test -f "$(cygpath -u "$APPDATA/modelmesh/config.json")" || { echo "installer did not create the Windows config"; exit 1; }
          test -d "$(cygpath -u "$LOCALAPPDATA/modelmesh/cache")" || { echo "installer did not create the Windows cache dir"; exit 1; }
          shim="$APPDATA/npm/claude.cmd"
          test -f "$(cygpath -u "$shim")" || { echo "missing claude.cmd shim"; exit 1; }
          grep -q 'cc-launcher.mjs' "$(cygpath -u "$shim")"
          out="$(node "$(cygpath -m "$root/bin/modelmesh")" path)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "$root"
